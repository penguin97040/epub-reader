[package]
name = "epub-reader"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
directories = "6"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "glow", "links", "system_fonts", "wayland", "x11"] }
egui = "0.37"
epub = "2.1.5"
html5ever = "0.39"
image = "0.25"
markup5ever = "0.39"
markup5ever_rcdom = "0.39"
mobi = "0.8"
open = "5"
percent-encoding = "2"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tendril = "0.5.1"

[dev-dependencies]
tempfile = "3.27.0"
zip = { version = "9.1.0", default-features = false, features = ["deflate"] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
strip = "symbols"
lto = "thin"
